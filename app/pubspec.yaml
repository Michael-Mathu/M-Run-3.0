name: mwendo_app
description: "Mwendo running tracker"
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.13
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.2.0
  maplibre_gl: ^0.26.2
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  dio: ^5.4.0
  web_socket_channel: ^3.0.3
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.2.5
  share_plus: ^13.2.0
  xml: ^7.0.1
  shimmer: ^3.0.0
  confetti: ^0.8.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  mwendo_gps_engine:
    path: ../packages/mwendo_gps_engine
  gps_pipeline:
    path: ../packages/gps_pipeline
  latlong2: ^0.10.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.19.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    # Legend portraits: Wikimedia Commons, free licences; credits in
    # lib/features/legends/legend_photos.dart (shown in-app).
    - assets/legends/
  # Inter (SIL Open Font License, assets/fonts/Inter-LICENSE.txt) stands in
  # for Apple's San Francisco on Android; iOS keeps the real system font.
  # "InterDisplay" is the optical-size cut for large titles (like SF Display).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800
